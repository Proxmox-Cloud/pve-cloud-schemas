[build]
build_commands = [
  [
    "rm", "-rf", "dist/"
  ],
  [
    "python", "-m", "build"
  ],
  [
    "twine", "upload", "--repository-url", "http://$REGISTRY_IP:8088/",
    "--username", "doesnt", "--password", "matter",
    "dist/pve_cloud_schemas-$VERSION.tar.gz", "dist/pve_cloud_schemas-$VERSION-py3-none-any.whl"
  ]
]
dyn_version_py_path = "src/pve_cloud_schemas/_version.py"


[local]
dyn_version_py_path = "src/pve_cloud_schemas/_version.py"


[redis]
version_key = "version.pve-cloud-schemas"
